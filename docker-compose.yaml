name: chatroom

services:
  backend:
    image: ${CHAT_ROOM_BACKEND_IMAGE:-chatroom-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    init: true
    environment:
      CHAT_ROOM_ADMIN_USERNAMES: ${CHAT_ROOM_ADMIN_USERNAMES:-}
      RUST_LOG: ${RUST_LOG:-chat_room=info,tower_http=info}
    expose:
      - "3000"
    volumes:
      - attachment_data:/app/chat_attachments
      - backend_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - chatroom

  frontend:
    image: ${CHAT_ROOM_FRONTEND_IMAGE:-chatroom-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${CHAT_ROOM_PORT:-3000}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=1m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    networks:
      - chatroom

networks:
  chatroom:
    driver: bridge

volumes:
  attachment_data:
  backend_data:
