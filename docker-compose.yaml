name: chatroom

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatroom}
      POSTGRES_USER: ${POSTGRES_USER:-chatroom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  falkordb:
    image: falkordb/falkordb-server:v4.18.8
    profiles: ["knowledge-graph"]
    restart: unless-stopped
    environment:
      REDIS_ARGS: --requirepass ${FALKORDB_PASSWORD:-}
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${FALKORDB_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  graph-service:
    build:
      context: ./graph-service
      dockerfile: Dockerfile
    profiles: ["knowledge-graph"]
    restart: unless-stopped
    init: true
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      GRAPH_API_TOKEN: ${CHAT_ROOM_KNOWLEDGE_GRAPH_TOKEN:-}
      GRAPH_FALKORDB_HOST: falkordb
      GRAPH_FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      GRAPH_LLM_API_KEY: ${CHAT_ROOM_AI_API_KEY:-}
      GRAPH_LLM_BASE_URL: ${GRAPH_LLM_BASE_URL:-https://api.openai.com/v1}
      GRAPH_LLM_MODEL: ${GRAPH_LLM_MODEL:-gpt-4.1-mini}
      GRAPH_EMBEDDING_API_KEY: ${CHAT_ROOM_AI_API_KEY:-}
      GRAPH_EMBEDDING_BASE_URL: ${GRAPH_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      GRAPH_EMBEDDING_MODEL: ${GRAPH_EMBEDDING_MODEL:-text-embedding-3-small}
      GRAPH_EMBEDDING_DIMENSIONS: ${GRAPH_EMBEDDING_DIMENSIONS:-1536}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  chatroom:
    image: ${CHAT_ROOM_IMAGE:-chatroom:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      CHAT_ROOM_ADMIN_USERNAMES: ${CHAT_ROOM_ADMIN_USERNAMES:-}
      CHAT_ROOM_ADMIN_ORPHAN_RETENTION_HOURS: ${CHAT_ROOM_ADMIN_ORPHAN_RETENTION_HOURS:-}
      CHAT_ROOM_ADMIN_DELETED_ROOM_RETENTION_DAYS: ${CHAT_ROOM_ADMIN_DELETED_ROOM_RETENTION_DAYS:-}
      CHAT_ROOM_UPLOADS_MAX_FILE_SIZE_MIB: ${CHAT_ROOM_UPLOADS_MAX_FILE_SIZE_MIB:-}
      CHAT_ROOM_UPLOADS_CHUNK_SIZE_MIB: ${CHAT_ROOM_UPLOADS_CHUNK_SIZE_MIB:-}
      CHAT_ROOM_UPLOADS_ABANDONED_UPLOAD_GC_HOURS: ${CHAT_ROOM_UPLOADS_ABANDONED_UPLOAD_GC_HOURS:-}
      CHAT_ROOM_ATTACHMENTS_DIRECTORY: ${CHAT_ROOM_ATTACHMENTS_DIRECTORY:-}
      CHAT_ROOM_OSS_ENABLED: ${CHAT_ROOM_OSS_ENABLED:-}
      CHAT_ROOM_OSS_LOCAL_MIRROR_ENABLED: ${CHAT_ROOM_OSS_LOCAL_MIRROR_ENABLED:-}
      CHAT_ROOM_OSS_DIRECT_UPLOAD_ENABLED: ${CHAT_ROOM_OSS_DIRECT_UPLOAD_ENABLED:-}
      CHAT_ROOM_OSS_PRESIGN_EXPIRY_SECS: ${CHAT_ROOM_OSS_PRESIGN_EXPIRY_SECS:-}
      CHAT_ROOM_OSS_OPERATION_TIMEOUT_SECS: ${CHAT_ROOM_OSS_OPERATION_TIMEOUT_SECS:-}
      CHAT_ROOM_OSS_PRESIGN_ENDPOINT: ${CHAT_ROOM_OSS_PRESIGN_ENDPOINT:-}
      CHAT_ROOM_OSS_PRESIGN_ADDRESSING_STYLE: ${CHAT_ROOM_OSS_PRESIGN_ADDRESSING_STYLE:-}
      CHAT_ROOM_OSS_ENDPOINT: ${CHAT_ROOM_OSS_ENDPOINT:-}
      CHAT_ROOM_OSS_BUCKET: ${CHAT_ROOM_OSS_BUCKET:-}
      CHAT_ROOM_OSS_ACCESS_KEY_ID: ${CHAT_ROOM_OSS_ACCESS_KEY_ID:-}
      CHAT_ROOM_OSS_ACCESS_KEY_SECRET: ${CHAT_ROOM_OSS_ACCESS_KEY_SECRET:-}
      CHAT_ROOM_OSS_ROOT: ${CHAT_ROOM_OSS_ROOT:-}
      CHAT_ROOM_AI_API_KEY: ${CHAT_ROOM_AI_API_KEY:-}
      CHAT_ROOM_AI_ENABLED: ${CHAT_ROOM_AI_ENABLED:-}
      CHAT_ROOM_AI_PROVIDER: ${CHAT_ROOM_AI_PROVIDER:-}
      CHAT_ROOM_AI_API_KEY_ENV: ${CHAT_ROOM_AI_API_KEY_ENV:-}
      CHAT_ROOM_AI_MODEL: ${CHAT_ROOM_AI_MODEL:-}
      CHAT_ROOM_AI_BASE_URL: ${CHAT_ROOM_AI_BASE_URL:-}
      CHAT_ROOM_AI_FAST_MODEL: ${CHAT_ROOM_AI_FAST_MODEL:-}
      CHAT_ROOM_AI_STANDARD_EXTRA_BODY: ${CHAT_ROOM_AI_STANDARD_EXTRA_BODY:-}
      CHAT_ROOM_AI_REASONING_EXTRA_BODY: ${CHAT_ROOM_AI_REASONING_EXTRA_BODY:-}
      CHAT_ROOM_AI_MAX_CONTEXT_MESSAGES: ${CHAT_ROOM_AI_MAX_CONTEXT_MESSAGES:-}
      CHAT_ROOM_AI_ANALYSIS_CONTEXT_MESSAGES: ${CHAT_ROOM_AI_ANALYSIS_CONTEXT_MESSAGES:-}
      CHAT_ROOM_AI_REQUEST_TIMEOUT_SECS: ${CHAT_ROOM_AI_REQUEST_TIMEOUT_SECS:-}
      CHAT_ROOM_AI_STREAM_IDLE_TIMEOUT_SECS: ${CHAT_ROOM_AI_STREAM_IDLE_TIMEOUT_SECS:-}
      CHAT_ROOM_AI_STREAM_TOTAL_TIMEOUT_SECS: ${CHAT_ROOM_AI_STREAM_TOTAL_TIMEOUT_SECS:-}
      CHAT_ROOM_AI_SUGGEST_COOLDOWN_SECS: ${CHAT_ROOM_AI_SUGGEST_COOLDOWN_SECS:-}
      CHAT_ROOM_DATABASE_KIND: ${CHAT_ROOM_DATABASE_KIND:-}
      CHAT_ROOM_DATABASE_SQLITE_PATH: ${CHAT_ROOM_DATABASE_SQLITE_PATH:-}
      CHAT_ROOM_DATABASE_MAX_CONNECTIONS: ${CHAT_ROOM_DATABASE_MAX_CONNECTIONS:-}
      CHAT_ROOM_DATABASE_URL: postgresql://${POSTGRES_USER:-chatroom}:${POSTGRES_PASSWORD:-chatroom}@postgres:5432/${POSTGRES_DB:-chatroom}
      CHAT_ROOM_REDIS_URL: redis://redis:6379/
      CHAT_ROOM_REDIS_ENABLED: ${CHAT_ROOM_REDIS_ENABLED:-}
      CHAT_ROOM_REDIS_KEY_PREFIX: ${CHAT_ROOM_REDIS_KEY_PREFIX:-}
      CHAT_ROOM_REDIS_CONNECT_TIMEOUT_MS: ${CHAT_ROOM_REDIS_CONNECT_TIMEOUT_MS:-}
      CHAT_ROOM_REDIS_COMMAND_TIMEOUT_MS: ${CHAT_ROOM_REDIS_COMMAND_TIMEOUT_MS:-}
      CHAT_ROOM_REDIS_MESSAGE_TTL_SECS: ${CHAT_ROOM_REDIS_MESSAGE_TTL_SECS:-}
      CHAT_ROOM_WORK_QUEUE_MESSAGE_CONCURRENCY: ${CHAT_ROOM_WORK_QUEUE_MESSAGE_CONCURRENCY:-}
      CHAT_ROOM_WORK_QUEUE_UPLOAD_CONCURRENCY: ${CHAT_ROOM_WORK_QUEUE_UPLOAD_CONCURRENCY:-}
      CHAT_ROOM_WORK_QUEUE_WAIT_TIMEOUT_SECS: ${CHAT_ROOM_WORK_QUEUE_WAIT_TIMEOUT_SECS:-}
      CHAT_ROOM_REALTIME_POLL_INTERVAL_MS: ${CHAT_ROOM_REALTIME_POLL_INTERVAL_MS:-}
      CHAT_ROOM_REALTIME_HEARTBEAT_INTERVAL_SECS: ${CHAT_ROOM_REALTIME_HEARTBEAT_INTERVAL_SECS:-}
      CHAT_ROOM_REALTIME_AUTH_TIMEOUT_SECS: ${CHAT_ROOM_REALTIME_AUTH_TIMEOUT_SECS:-}
      CHAT_ROOM_REALTIME_HISTORY_REPLAY_LIMIT: ${CHAT_ROOM_REALTIME_HISTORY_REPLAY_LIMIT:-}
      CHAT_ROOM_REALTIME_MESSAGE_POLL_LIMIT: ${CHAT_ROOM_REALTIME_MESSAGE_POLL_LIMIT:-}
      CHAT_ROOM_REALTIME_POKE_COOLDOWN_SECS: ${CHAT_ROOM_REALTIME_POKE_COOLDOWN_SECS:-}
      CHAT_ROOM_AUTH_SESSION_LIFETIME_DAYS: ${CHAT_ROOM_AUTH_SESSION_LIFETIME_DAYS:-}
      CHAT_ROOM_VECTOR_ENABLED: ${CHAT_ROOM_VECTOR_ENABLED:-}
      CHAT_ROOM_VECTOR_URL: http://qdrant:6333
      CHAT_ROOM_VECTOR_COLLECTION: ${CHAT_ROOM_VECTOR_COLLECTION:-}
      CHAT_ROOM_VECTOR_API_KEY_ENV: ${CHAT_ROOM_VECTOR_API_KEY_ENV:-}
      CHAT_ROOM_VECTOR_API_KEY: ${CHAT_ROOM_VECTOR_API_KEY:-}
      CHAT_ROOM_VECTOR_TOP_K: ${CHAT_ROOM_VECTOR_TOP_K:-}
      CHAT_ROOM_VECTOR_SCORE_THRESHOLD: ${CHAT_ROOM_VECTOR_SCORE_THRESHOLD:-}
      CHAT_ROOM_VECTOR_WORKER_INTERVAL_MS: ${CHAT_ROOM_VECTOR_WORKER_INTERVAL_MS:-}
      CHAT_ROOM_EMBEDDING_BASE_URL: ${CHAT_ROOM_EMBEDDING_BASE_URL:-}
      CHAT_ROOM_EMBEDDING_MODEL: ${CHAT_ROOM_EMBEDDING_MODEL:-}
      CHAT_ROOM_EMBEDDING_DIMENSIONS: ${CHAT_ROOM_EMBEDDING_DIMENSIONS:-}
      CHAT_ROOM_EMBEDDING_API_KEY_ENV: ${CHAT_ROOM_EMBEDDING_API_KEY_ENV:-}
      CHAT_ROOM_KNOWLEDGE_GRAPH_ENABLED: ${CHAT_ROOM_KNOWLEDGE_GRAPH_ENABLED:-false}
      CHAT_ROOM_KNOWLEDGE_GRAPH_URL: http://graph-service:8000
      CHAT_ROOM_KNOWLEDGE_GRAPH_TOKEN: ${CHAT_ROOM_KNOWLEDGE_GRAPH_TOKEN:-}
      CHAT_ROOM_KNOWLEDGE_GRAPH_API_TOKEN_ENV: ${CHAT_ROOM_KNOWLEDGE_GRAPH_API_TOKEN_ENV:-}
      CHAT_ROOM_KNOWLEDGE_GRAPH_MAX_FACTS: ${CHAT_ROOM_KNOWLEDGE_GRAPH_MAX_FACTS:-}
      CHAT_ROOM_KNOWLEDGE_GRAPH_GRAPH_LIMIT: ${CHAT_ROOM_KNOWLEDGE_GRAPH_GRAPH_LIMIT:-}
      CHAT_ROOM_KNOWLEDGE_GRAPH_WORKER_INTERVAL_MS: ${CHAT_ROOM_KNOWLEDGE_GRAPH_WORKER_INTERVAL_MS:-}
      CHAT_ROOM_KNOWLEDGE_GRAPH_REQUEST_TIMEOUT_SECS: ${CHAT_ROOM_KNOWLEDGE_GRAPH_REQUEST_TIMEOUT_SECS:-}
      CHAT_ROOM_KNOWLEDGE_GRAPH_SEARCH_TIMEOUT_MS: ${CHAT_ROOM_KNOWLEDGE_GRAPH_SEARCH_TIMEOUT_MS:-}
      CHAT_ROOM_KNOWLEDGE_GRAPH_WORKER_CONCURRENCY: ${CHAT_ROOM_KNOWLEDGE_GRAPH_WORKER_CONCURRENCY:-}
      RUST_LOG: ${RUST_LOG:-chat_room=info,tower_http=info}
    ports:
      - "${CHAT_ROOM_PORT:-3000}:3000"
    volumes:
      - ./chat-room.toml:/app/chat-room.toml:ro
      - attachment_data:/app/chat_attachments
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  attachment_data:
  postgres_data:
  redis_data:
  qdrant_data:
  falkordb_data:
