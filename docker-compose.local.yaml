name: chatroom-local

# The test suite discovers these services ONLY through env vars (tests/service_skip/mod.rs):
#   postgres -> TEST_POSTGRES_ADMIN_URL  (default mapping below: postgresql://chatroom:chatroom@127.0.0.1:52735/postgres)
#   redis    -> TEST_REDIS_URL           (default mapping below: redis://127.0.0.1:6379/)
# Var unset: the matching tests skip, each printing one "SKIPPED: <service> not verified" line.
# Var set but service unreachable: those tests panic instead of skipping.
# If you override POSTGRES_PORT, put the same port in TEST_POSTGRES_ADMIN_URL.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatroom}
      POSTGRES_USER: ${POSTGRES_USER:-chatroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatroom}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-52735}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
