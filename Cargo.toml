[package]
name = "chat_room"
version = "0.1.0"
edition = "2021"
autobins = false
default-run = "server"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "stress"
path = "src/bin/stress.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "4", features = ["axum_extras"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = { version = "0.3", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = "0.23"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
anyhow = "1"
async-trait = "0.1"
argon2 = "0.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "uuid", "chrono", "migrate", "macros"] }
rustyline = "17"
colored = "3"
mime_guess = "2"
toml = "1.1.4"
genai = "0.6.5"
langchain-rust = { version = "=4.6.0", default-features = false }
opendal = { version = "0.58.1", default-features = false, features = ["services-fs", "services-oss", "executors-tokio"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
toon-format = { version = "=0.5.0", default-features = false }
dotenvy = "0.15"

[dev-dependencies]
