name: CI/CD

on:
  push:
    # `agent/**` covers the Telegram-parity worktree branches. Without it a task
    # branch got no CI until it was already merged into main, which is part of
    # how a16f422 landed red (see TG-000's finding in docs/tg/board.md).
    branches: [main, "agent/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: 1.97.1
  UV_VERSION: 0.11.31
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Overrides the host-specific build.target-dir in .cargo/config.toml, which
  # points at a developer volume that does not exist on the runner.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  test:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # The old Vue client in web/ is deliberately outside the bun workspace declared by the
      # root package.json, so the two installs are independent until TG-602 deletes web/.
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: desktop
        run: uv sync --locked --extra dev

      - name: Audit source file sizes
        run: python3 scripts/check_file_sizes.py

      - name: Check migration parity
        run: python3 scripts/check_migration_parity.py

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check web formatting
        working-directory: web
        run: bun run format:check

      - name: Check web types
        working-directory: web
        run: bun run typecheck

      - name: Run web tests
        working-directory: web
        run: bun test

      # The frozen Vue client is still built so that "it stays independently
      # runnable until TG-602" is verified rather than assumed. Its size is no
      # longer budget-checked: nobody edits it, so it cannot regress.
      - name: Build web client
        working-directory: web
        run: bun run build

      - name: Check packages formatting
        run: bun run -F '@tg/*' lint

      - name: Check packages types
        run: bun run -F '@tg/*' typecheck

      # architecture.md section 2 / decision D-002: packages/core must import no
      # react / react-dom / @tg/ui / @tg/web and reference no window / document /
      # localStorage / navigator, or the React Native door closes. Its own gate so a failure
      # is unmistakable in the log; it also runs inside "Run packages tests".
      - name: Check packages/core platform boundary
        working-directory: packages/core
        run: bun run boundary

      - name: Run packages tests
        run: bun run -F '@tg/*' test

      - name: Build React client
        working-directory: packages/web
        run: bun run build

      # Must follow the React build: this measures packages/web/dist, which is
      # what the server embeds. It previously ran after the Vue build and
      # measured web/dist/assets/app.js, so the budget was enforced on a client
      # that no longer ships.
      - name: Check web bundle transfer size
        run: python3 scripts/check_web_bundle.py

      - name: Run desktop tests
        working-directory: desktop
        run: uv run pytest

      - name: Lint desktop client
        working-directory: desktop
        run: uv run ruff check src tests

      - name: Check desktop formatting
        working-directory: desktop
        run: uv run ruff format --check src tests main.py

      - name: Run Rust tests
        run: cargo test --all-targets

  image:
    name: Build container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=chatroom-image
          cache-to: type=gha,mode=max,scope=chatroom-image

  publish:
    name: Publish container image
    needs: [test, image]
    # Only main and version tags publish. The metadata step tags with
    # `type=ref,event=branch`, so without this guard every `agent/**` task branch
    # push would publish an image named after the branch to ghcr.io — a
    # consequence of widening the push trigger to agent/** for CI coverage.
    # The `image` job above still builds (push: false) on those branches, which
    # is the coverage that was wanted.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            name=${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}/${{ github.event.repository.name }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=chatroom-image
