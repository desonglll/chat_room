[uploads]
# Maximum size of one uploaded file. Restart the server after changing this value.
max_file_size_mib = 1025
# Per-request body cap for one chunk of a resumable upload — independent of
# max_file_size_mib above, since chunks stay small regardless of file size.
chunk_size_mib = 8
# How long an abandoned in-progress upload's staged bytes are kept before
# being garbage-collected on startup.
abandoned_upload_gc_hours = 24

[attachments]
# In-progress (chunked) uploads always stage here first regardless of the OSS
# setting below. When OSS is off, the finished file also lives here.
directory = "chat_attachments"

[attachments.oss]
# If enabled, finished uploads are stored in Aliyun OSS. In-progress chunked
# uploads still stage locally.
enabled = false
# Keep a final local copy too. Reads prefer OSS and fall back to this copy when
# the object is missing or OSS is unavailable.
local_mirror_enabled = false
# Return a short-lived, object-scoped PUT URL so the browser can upload to OSS
# without sending the file through this server. Failed PUTs fall back to chunks.
direct_upload_enabled = false
presign_expiry_secs = 900
# Upper bound for each OSS operation before a local mirror is used.
operation_timeout_secs = 30
endpoint = ""
bucket = ""
access_key_id = ""
access_key_secret = ""
root = "/"
# Set this to a public endpoint/CNAME if `endpoint` is internal-only.
presign_endpoint = ""
presign_addressing_style = "virtual"

[database]
# Use "sqlite" or "postgres". CLI --database-type overrides this value.
kind = "postgres"
sqlite_path = "chat_rooms.db"
# postgres_url = "postgres://chat:password@localhost/chat_room"
postgres_url = "postgresql://postgres:postgres@localhost:52735/chatroom"
max_connections = 10

[ai]
# The magic-wand button: summarizes a room's recent messages and suggests
# replies. Disabled by default. `api_key_env` should normally be the name of
# an environment variable holding the key, e.g. export CHAT_ROOM_AI_API_KEY=sk-...
# The server reports AI as unavailable until this environment variable exists.
enabled = true
# Protocol adapter: "openai" for any OpenAI-compatible service, or "anthropic".
provider = "openai"
api_key_env = "CHAT_ROOM_AI_API_KEY"
model = "deepseek-ai/DeepSeek-V4-Flash"
# Non-reasoning model used when the per-session thinking switch is off.
fast_model = "deepseek-ai/DeepSeek-V3.2"
base_url = "https://api.siliconflow.cn/v1"
# Optional provider extensions, forwarded exactly as configured. No fields are
# inferred from the endpoint or vendor.
standard_extra_body = { enable_thinking = false }
reasoning_extra_body = { reasoning_effort = "high" }
max_context_messages = 30
# The independent AI workspace can inspect a wider, still bounded window.
analysis_context_messages = 5000
# Long-context requests can take longer than short suggestions on hosted models.
request_timeout_secs = 60
# Any valid upstream event resets the idle deadline. The larger total deadline
# prevents an endlessly active provider stream from occupying a connection.
stream_idle_timeout_secs = 30
stream_total_timeout_secs = 300
# Per-user cooldown between AI suggestion requests in the same room.
suggest_cooldown_secs = 10

[vector_store]
# Qdrant and the embedding API are never contacted unless this is explicitly true.
enabled = false
url = "http://127.0.0.1:6333"
collection = "chat_messages"
# Optional environment variable containing a Qdrant API key.
api_key_env = ""
dimensions = 1024
top_k = 6
score_threshold = 0.55
# Any OpenAI-compatible /embeddings endpoint can be used independently of [ai].
embedding_base_url = ""
embedding_model = ""
embedding_api_key_env = "CHAT_ROOM_AI_API_KEY"
rerank_enabled = false
rerank_base_url = ""
rerank_model = ""
rerank_api_key_env = "CHAT_ROOM_AI_API_KEY"
rerank_timeout_ms = 2000
rerank_score_threshold = 0.35
worker_interval_ms = 500

[realtime]
# WebSocket timing and per-tick history/poll limits. Restart after changing.
poll_interval_ms = 250
heartbeat_interval_secs = 15
auth_timeout_secs = 10
history_replay_limit = 100
message_poll_limit = 200
# Per-(room, from, target) cooldown between pokes ("拍一拍").
poke_cooldown_secs = 5

[auth]
session_lifetime_days = 30
# open, invite_only, or disabled
registration_mode = "open"
# Fixed-window authentication abuse controls, enforced for both IP and account.
rate_limit_window_secs = 60
rate_limit_ip_attempts = 60
rate_limit_account_attempts = 10

[security]
# Exact cross-origin browser origins. Empty keeps the API same-origin only.
cors_allowed_origins = []
# Enable only behind a proxy that removes client-supplied forwarding headers.
trust_proxy_headers = false

[redis]
# Redis accelerates bearer-session lookups and message history pages.
# PostgreSQL/SQLite remains the source of truth, and requests fall back to it.
enabled = true
url = "redis://127.0.0.1:6379/"
key_prefix = "chat-room"
connect_timeout_ms = 1500
command_timeout_ms = 500
# Read-through cache lifetime for message history pages. Room versions invalidate immediately.
message_ttl_secs = 30

[work_queue]
# Fair in-process admission queues. The database and resumable upload sessions
# remain the durable source of truth, so retries are idempotent after restarts.
message_concurrency = 32
upload_concurrency = 4
wait_timeout_secs = 30

[web_push]
# Disabled until a matching URL-safe, unpadded VAPID key pair is configured.
enabled = false
public_key = ""
private_key = ""
# Required when enabled. Use a monitored mailto: address or an HTTPS contact URL.
subject = ""
# Exact hosts or parent domains for trusted browser Push services.
allowed_endpoint_hosts = [
  "fcm.googleapis.com",
  "updates.push.services.mozilla.com",
  "web.push.apple.com",
  "notify.windows.com",
]
poll_interval_ms = 1000
request_timeout_secs = 10
max_attempts = 5

[admin]
# System-wide operations are disabled until at least one existing account is
# allowlisted here. Matching is case-insensitive.
usernames = [ "mike" ]
# Recalled, unreferenced attachment objects are eligible for explicit cleanup
# from the dashboard after this retention window.
orphan_retention_hours = 168
# Soft-deleted rooms are eligible for explicit permanent cleanup after this age.
deleted_room_retention_days = 30
