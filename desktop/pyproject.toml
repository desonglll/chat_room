[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "echo-chat-desktop"
version = "0.1.0"
description = "Native Qt desktop client for Chat Room"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["PySide6>=6.10,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
echo-chat = "echo_chat.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_chat"]

[tool.hatch.build.targets.wheel.force-include]
"src/echo_chat/assets/app-icon.png" = "echo_chat/assets/app-icon.png"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
