[project]
name = "chat-room-graph-service"
version = "0.1.0"
description = "Authenticated Graphiti adapter for isolated room knowledge graphs"
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi==0.136.3",
    "graphiti-core[falkordb]==0.29.3",
    "httpx==0.28.1",
    "pydantic-settings==2.10.1",
    "redis>=6.4,<8",
    "uvicorn[standard]==0.45.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pyright==1.1.402",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["room_graph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["room_graph", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
